
<html>
<head>
    <title>Student Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Expense Tracker</h1>

    <div class="box">

        <h2>Add Expense</h2>

        <input type="text" id="name" placeholder="Expense Name">

        <input type="number" id="amount" placeholder="Amount">

        <select id="category">
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Other</option>
        </select>

        <button onclick="addExpense()">Add</button>

        <h2>Total: ₹<span id="total">0</span></h2>

        <h3>Filter</h3>

        <select id="filter" onchange="showExpenses()">
            <option>All</option>
            <option>Food</option>
            <option>Travel</option>
            <option>Shopping</option>
            <option>Education</option>
            <option>Other</option>
        </select>

        <h2>My Expenses</h2>

        <div id="list"></div>

    </div>

    <script src="script.js"></script>

</body>
</html>
